<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero Hour - Upcoming Rocket Launches</title>
  <meta name="description" content="Upcoming orbital rocket launches worldwide.">
  <meta name="theme-color" content="#05060b">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <header class="header">
    <div class="brand">
      <h1>Zero Hour</h1>
      <p>Upcoming orbital rocket launches.</p>
    </div>
    <div class="header__right">
      <div class="tz" role="group" aria-label="Time zone">
        <button type="button" data-tz="local" aria-pressed="true">Local</button>
        <button type="button" data-tz="utc" aria-pressed="false">UTC</button>
      </div>
      <p id="status" class="status">Loading launches...</p>
    </div>
  </header>

  <section class="hero" id="hero">
    <canvas id="ascent" class="hero__ascent" aria-hidden="true"></canvas>
    <div class="hero__planet" aria-hidden="true"></div>
    <div class="hero__content" id="hero-content">
      <p class="hero__eyebrow">Next launch</p>
      <h2 class="hero__title" id="hero-title">Loading...</h2>
      <p class="hero__sub" id="hero-sub"></p>
      <div class="countdown" id="hero-countdown">
        <div class="countdown__unit"><strong data-unit="d">00</strong><span>Days</span></div>
        <div class="countdown__unit"><strong data-unit="h">00</strong><span>Hours</span></div>
        <div class="countdown__unit"><strong data-unit="m">00</strong><span>Minutes</span></div>
        <div class="countdown__unit"><strong data-unit="s">00</strong><span>Seconds</span></div>
      </div>
    </div>
  </section>

  <main>
    <div class="toolbar">
      <input type="search" id="search" class="search" placeholder="Search mission, rocket, provider, pad...">

      <div class="chips" id="status-chips">
        <button type="button" class="chip is-active" data-status="all">All</button>
        <button type="button" class="chip" data-status="Go">Go</button>
        <button type="button" class="chip" data-status="TBC">TBC</button>
        <button type="button" class="chip" data-status="TBD">TBD</button>
      </div>

      <select id="provider" class="provider">
        <option value="">All providers</option>
      </select>
    </div>

    <div id="launches" class="timeline"></div>

    <div class="no-results" id="no-results" hidden>
      <p>No launches match those filters.</p>
      <button type="button" class="btn" id="clear-filters">Clear filters</button>
    </div>
  </main>

  <footer class="footer">
    <p>Launch data by <a href="https://thespacedevs.com" target="_blank" rel="noopener">The Space Devs</a> - Launch Library 2</p>
    <p class="sync" id="sync">Awaiting data</p>
  </footer>

  <dialog class="detail" id="detail">
    <div class="detail__panel">
      <button type="button" class="detail__close" id="detail-close" aria-label="Close">&#215;</button>
      <div class="detail__media" id="detail-media"></div>
      <div class="detail__body" id="detail-body"></div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
