<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero Hour - Upcoming Rocket Launches</title>
  <meta name="description" content="Upcoming orbital rocket launches worldwide.">
  <meta name="theme-color" content="#05060b">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1>Zero Hour</h1>
      <p>Upcoming orbital rocket launches.</p>
    </div>
    <p id="status" class="status">Loading launches...</p>
  </header>

  <section class="hero" id="hero">
    <p class="hero__eyebrow">Next launch</p>
    <h2 class="hero__title" id="hero-title">Loading...</h2>
    <p class="hero__sub" id="hero-sub"></p>
    <div class="countdown" id="hero-countdown">
      <div class="countdown__unit"><strong data-unit="d">00</strong><span>Days</span></div>
      <div class="countdown__unit"><strong data-unit="h">00</strong><span>Hours</span></div>
      <div class="countdown__unit"><strong data-unit="m">00</strong><span>Minutes</span></div>
      <div class="countdown__unit"><strong data-unit="s">00</strong><span>Seconds</span></div>
    </div>
  </section>

  <main>
    <div id="launches" class="grid"></div>
  </main>

  <footer class="footer">
    <p>Launch data by <a href="https://thespacedevs.com" target="_blank" rel="noopener">The Space Devs</a> - Launch Library 2</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
